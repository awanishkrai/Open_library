<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adhyay- Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #2563eb;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-top: 20px;
        }

        h1,
        h2 {
            text-align: center;
            color: #333;
        }

        .search-box {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            padding: 10px;
        }

        .book-card {
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.2s;
        }

        .book-card:hover {
            transform: scale(1.02);
        }

        .book-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .read-btn {
            display: inline-block;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
        }

        .read-btn:hover {
            background: #1e40af;
        }

        .footer {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
        }

        .hidden {
            display: none;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Navigation bar -->
    <div class="navbar">
        <a href="index.html">📚 Adhyay</a>
        <div>
            <span id="userWelcome" class="hidden" style="margin-right: 10px;"></span>
            <a id="loginLink" href="login.html">Login</a>
            <a id="registerLink" href="register.html">Register</a>
            <a id="logoutLink" href="#" onclick="logout()" class="hidden">Logout</a>
        </div>
    </div>

    <!-- Welcome and Search -->
    <div class="container">
        <h1>Welcome to Open Library</h1>
        <p class="text-center">Explore a vast collection of books</p>
        <input id="search" type="text" placeholder="Search books..." class="search-box" onkeyup="searchBooks()" />
    </div>

    <!-- Book List Section -->
    <div class="container">
        <h2>Available Books</h2>
        <div id="booksList" class="book-grid">
            <p class="text-center">Loading books...</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2025 Open Library. All rights reserved.</p>
    </div>

    <!-- JavaScript -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            checkLogin();
            loadBooks();

            // Auto-reload every 50 seconds
            setInterval(() => {
                window.location.reload();
            }, 50000);
        });

        function checkLogin() {
            const user = JSON.parse(localStorage.getItem("user"));
            const welcomeEl = document.getElementById("userWelcome");

            if (user && user.username) {
                welcomeEl.textContent = `👋 Hello, ${user.username}`;
                welcomeEl.classList.remove("hidden");

                document.getElementById("loginLink").classList.add("hidden");
                document.getElementById("registerLink").classList.add("hidden");
                document.getElementById("logoutLink").classList.remove("hidden");
            } else {
                welcomeEl.textContent = "";
                welcomeEl.classList.add("hidden");

                document.getElementById("loginLink").classList.remove("hidden");
                document.getElementById("registerLink").classList.remove("hidden");
                document.getElementById("logoutLink").classList.add("hidden");
            }
        }

        function logout() {
            localStorage.removeItem("user");
            window.location.href = "login.html";
        }
    function redirectToDetails(bookId) {
        window.location.href = `book.html?id=${bookId}`;
    }

        function loadBooks() {
            fetch("http://localhost/new%20proj/open%20library/backend/api/books.php")
                .then(response => response.json())
                .then(data => {
                    const booksList = document.getElementById("booksList");
                    booksList.innerHTML = "";

                    if (!Array.isArray(data) || data.length === 0) {
                        booksList.innerHTML = `<p class="text-center">No books available.</p>`;
                        return;
                    }

                    data.forEach(book => {
                        const bookCard = `
    <div class="book-card" onclick="redirectToDetails(${book.id})" style="cursor: pointer;">
        <img src="http://localhost/new%20proj/open%20library/${book.image_path}" 
             alt="${book.title} Cover"
             onerror="this.src='http://localhost/new%20proj/open%20library/frontend/falback.jpg'" />
        <h3>${book.title}</h3>
        <p><strong>Author:</strong> ${book.author}</p>
        <p><strong>Year:</strong> ${book.year}</p>
        ${isLoggedIn() ? `<button class="read-btn" onclick="event.stopPropagation(); addToReadlist(${book.id})">+ Add to Readlist</button>` : ''}
    </div>
`;

                        booksList.innerHTML += bookCard;
                    });
                })
                .catch(error => {
                    console.error("Error fetching books:", error);
                    document.getElementById("booksList").innerHTML = `<p class="text-center">Failed to load books.</p>`;
                });
        }

        function isLoggedIn() {
            const user = JSON.parse(localStorage.getItem("user"));
            return user && user.username;
        }

        function searchBooks() {
            let input = document.getElementById("search").value.toLowerCase();
            let books = document.querySelectorAll(".book-card");

            books.forEach(book => {
                let title = book.querySelector("h3").textContent.toLowerCase();
                book.style.display = title.includes(input) ? "block" : "none";
            });
        }

        function addToReadlist(bookId) {
            const user = JSON.parse(localStorage.getItem("user"));
            const username = user?.username;

            if (!username) {
                alert("Please log in to add books to your readlist.");
                return;
            }

            fetch("http://localhost/new%20proj/open%20library/backend/api/readlist.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    book_id: bookId
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("Book added to your readlist!");
                    } else {
                        alert("Error: " + (data.error || "Something went wrong."));
                    }
                })
                .catch(error => {
                    console.error("Error adding to readlist:", error);
                    alert("Failed to add book to readlist.");
                });
        }
    </script>
</body>

</html>
