<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Readlist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }

    .navbar {
      background-color: #2563eb;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .readlist-item {
      display: flex;
      align-items: flex-start;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .readlist-item:last-child {
      border-bottom: none;
    }

    .readlist-item img {
      width: 50px;
      height: 70px;
      object-fit: cover;
      border-radius: 4px;
    }

    .book-info {
      flex: 1;
      margin-left: 20px;
    }

    .book-info h3 {
      margin: 0;
    }

    textarea {
      width: 100%;
      margin-top: 5px;
      padding: 5px;
      resize: vertical;
    }

    .status-select {
      padding: 5px;
      margin: 5px 5px 5px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .button {
      padding: 5px 10px;
      background-color: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 5px;
    }

    .button:hover {
      background-color: #0056b3;
    }

    .text-center {
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    <a href="index.html">📚 Adhyay</a>
    <div>
      <span id="userWelcome" class="hidden" style="margin-right: 10px;"></span>
      <a id="loginLink" href="login.html">Login</a>
      <a id="registerLink" href="register.html">Register</a>
      <a id="logoutLink" href="#" onclick="logout()" class="hidden">Logout</a>
    </div>
  </div>

  <!-- Container -->
  <div class="container">
    <h2 class="text-center">My Readlist</h2>
    <div id="message"></div>
    <div id="readlistContainer"></div>
  </div>

  <div class="footer">
    &copy; 2025 Open Library. All rights reserved.
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      checkLogin();
    });

    function checkLogin() {
      const user = JSON.parse(localStorage.getItem("user"));
      const welcomeEl = document.getElementById("userWelcome");

      if (user && user.username) {
        welcomeEl.textContent = `👋 Hello, ${user.username}`;
        welcomeEl.classList.remove("hidden");
        document.getElementById("loginLink").classList.add("hidden");
        document.getElementById("registerLink").classList.add("hidden");
        document.getElementById("logoutLink").classList.remove("hidden");
        loadReadlist(user.username);
      } else {
        welcomeEl.textContent = "";
        welcomeEl.classList.add("hidden");
        document.getElementById("loginLink").classList.remove("hidden");
        document.getElementById("registerLink").classList.remove("hidden");
        document.getElementById("logoutLink").classList.add("hidden");
        document.getElementById("readlistContainer").innerHTML =
          "<p class='text-center'>Please log in to view your readlist.</p>";
      }
    }

    function logout() {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    }

    function loadReadlist(username) {
      fetch(`http://localhost/new%20proj/open%20library/backend/api/readlist.php?username=${username}`)
        .then(res => res.json())
        .then(data => {
          if (data.readlist && data.readlist.length > 0) {
            displayReadlist(data.readlist);
          } else {
            document.getElementById("readlistContainer").innerHTML =
              "<p class='text-center'>Your readlist is empty.</p>";
          }
        })
        .catch(err => {
          console.error("Failed to fetch readlist", err);
          document.getElementById("readlistContainer").innerHTML =
            "<p class='text-center'>Error loading readlist.</p>";
        });
    }

    function displayReadlist(readlist) {
      const container = document.getElementById("readlistContainer");
      container.innerHTML = "";

      readlist.forEach(book => {
        const bookDiv = document.createElement("div");
        bookDiv.classList.add("readlist-item");

        const imgURL = `http://localhost/new%20proj/open%20library/${book.image_path}`;

        bookDiv.innerHTML = `
          <img src="${imgURL}" alt="${book.title}" onerror="this.src='fallback.jpg';" />
          <div class="book-info">
            <h3>${book.title} by ${book.author} (${book.year})</h3>
            <p>Status: <span id="status-${book.readlist_id}">${book.status}</span></p>
            <textarea id="notes-${book.readlist_id}" rows="2">${book.notes || ""}</textarea>
            <div>
              <select class="status-select" id="statusSelect-${book.readlist_id}">
                <option value="to-read" ${book.status === 'to-read' ? 'selected' : ''}>To Read</option>
                <option value="reading" ${book.status === 'reading' ? 'selected' : ''}>Reading</option>
                <option value="read" ${book.status === 'read' ? 'selected' : ''}>Read</option>
              </select>
              <button class="button" onclick="updateBook(${book.readlist_id})">Update</button>
              <button class="button" onclick="deleteBook(${book.readlist_id})">Remove</button>
            </div>
          </div>
        `;
        container.appendChild(bookDiv);
      });
    }

    function updateBook(bookId) {
      const status = document.getElementById(`statusSelect-${bookId}`).value;
      const notes = document.getElementById(`notes-${bookId}`).value;

      fetch("http://localhost/new%20proj/open%20library/backend/api/readlist.php", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ readlist_id: bookId, status, notes })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("Book updated successfully.");
          } else {
            alert("Update failed: " + data.error);
          }
        })
        .catch(err => {
          console.error("Update error", err);
          alert("Failed to update.");
        });
    }

    function deleteBook(bookId) {
      if (!confirm("Are you sure you want to delete this book?")) return;

      fetch("http://localhost/new%20proj/open%20library/backend/api/readlist.php", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ readlist_id: bookId })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("Book removed.");
            const user = JSON.parse(localStorage.getItem("user"));
            loadReadlist(user.username);
          } else {
            alert("Delete failed: " + data.error);
          }
        })
        .catch(err => {
          console.error("Delete error", err);
          alert("Failed to delete.");
        });
    }
  </script>
</body>

</html>
