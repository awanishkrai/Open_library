<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Details - Adhyay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background: white;
            margin-top: 30px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2 {
            text-align: center;
        }

        .book-details img {
            max-width: 200px;
            display: block;
            margin: 0 auto;
            border-radius: 4px;
        }

        .comments-section {
            margin-top: 30px;
        }

        .comment {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .comment strong {
            color: #2563eb;
        }

        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .text-center {
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="bookInfo" class="book-details">
            <p class="text-center">Loading book details...</p>
        </div>

        <div class="comments-section">
            <h2>📚 Discussion</h2>
            <div id="comments"></div>

            <div id="commentFormContainer" class="hidden">
                <textarea id="commentText" placeholder="Share your thoughts..."></textarea>
                <button onclick="submitComment()">Post Comment</button>
            </div>

            <p id="loginPrompt" class="text-center hidden">
                🔒 Please <a href="login.html">log in</a> to post a comment.
            </p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const bookId = params.get("id");

        document.addEventListener("DOMContentLoaded", () => {
            fetchBookDetails();
            loadComments();
            checkLoginStatus();
            setInterval(loadComments, 20000); // Auto-refresh comments
        });

        function checkLoginStatus() {
            const user = JSON.parse(localStorage.getItem("user"));
            if (user && user.username) {
                document.getElementById("commentFormContainer").classList.remove("hidden");
                document.getElementById("loginPrompt").classList.add("hidden");
            } else {
                document.getElementById("commentFormContainer").classList.add("hidden");
                document.getElementById("loginPrompt").classList.remove("hidden");
            }
        }

        function fetchBookDetails() {
            fetch(`http://localhost/new%20proj/open%20library/backend/api/book_details.php?id=${bookId}`)
                .then(res => res.json())
                .then(book => {
                    const html = `
            <img src="http://localhost/new%20proj/open%20library/${book.image_path}" alt="${book.title}" onerror="this.src='fallback.jpg'" />
            <h1>${book.title}</h1>
            <p><strong>Author:</strong> ${book.author}</p>
            <p><strong>Year:</strong> ${book.year}</p>
            <p><strong>Description:</strong> ${book.description || "No description available."}</p>
          `;
                    document.getElementById("bookInfo").innerHTML = html;
                })
                .catch(err => {
                    document.getElementById("bookInfo").innerHTML = "<p class='text-center'>Failed to load book details.</p>";
                    console.error(err);
                });
        }

        function loadComments() {
            fetch(`http://localhost/new%20proj/open%20library/backend/api/discussion.php?book_id=${bookId}`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById("comments");
                    if (!Array.isArray(data) || data.length === 0) {
                        container.innerHTML = "<p class='text-center'>No comments yet.</p>";
                        return;
                    }

                    container.innerHTML = data.map(comment => `
            <div class="comment">
              <strong>${comment.username}</strong> 
              <small>(${new Date(comment.created_at).toLocaleString()})</small>
              <p>${comment.comment}</p>
            </div>
          `).join("");
                })
                .catch(err => {
                    document.getElementById("comments").innerHTML = "<p class='text-center'>Failed to load comments.</p>";
                    console.error(err);
                });
        }

        function submitComment() {
            const user = JSON.parse(localStorage.getItem("user"));
            const text = document.getElementById("commentText").value.trim();

            if (!user || !user.username) {
                alert("You must be logged in to comment.");
                return;
            }

            if (!text) {
                alert("Please write something before posting!");
                return;
            }

            fetch("http://localhost/new%20proj/open%20library/backend/api/discussion.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: user.username,
                    book_id: bookId,
                    comment: text // ✅ Fixed: must be `comment` not `text`
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById("commentText").value = "";
                        loadComments();
                    } else {
                        alert("Error: " + (data.error || "Could not post comment."));
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Failed to post comment.");
                });
        }
    </script>
</body>

</html>
