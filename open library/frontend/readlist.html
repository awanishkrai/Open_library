<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Readlist - Open Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
       
    </style>
</head>
<body class="bg-gray-50 text-gray-900 bg-cover bg-center"
    style="background-image: url('http://localhost/new%20proj/open%20library/frontend/background.jpg');">


    <!-- Navbar -->
    <div class="navbar text-white p-4 shadow-md text-black bg-gradient-to-r from-pink-500 via-orange-400 to-indigo-600 text-white">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <!-- Logo -->
            <img src="http://localhost/new%20proj/open%20library/frontend/logo.jpeg" alt="Open Library Logo" class="logo h-[60px] w-[60px]">
            <div>
                <span id="userGreeting" class="mr-6 text-xl font-medium text-black"></span>
                <button onclick="logout()" class="btn-logout hover:bg-gray-100 text-black">Logout</button>
            </div>
        </div>
    </div>

    <!-- Container for the Reading List -->
    <div class="max-w-7xl mx-auto mt-8 px-6 py-8 bg-white rounded-lg shadow-md container">
        <h2 class="text-3xl font-semibold text-center mb-6">Your Reading List</h2>

        <!-- Readlist Container -->
        <div id="readlistContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Book cards will go here -->
        </div>

        <!-- Empty Message -->
        <p id="emptyMessage" class="text-center text-gray-500 mt-6 hidden">No books in your reading list.</p>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        const username = user?.username;
        if (!username) {
            alert("Please login first.");
            window.location.href = "login.html";
        }

        document.getElementById("userGreeting").textContent = `Hi, ${username}`;

        function logout() {
            localStorage.removeItem("user");
            window.location.href = "login.html";
        }

        function fetchReadlist() {
            fetch(`http://localhost/new%20proj/open%20library/backend/api/readlist.php?username=${username}`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById("readlistContainer");
                    container.innerHTML = "";
                    if (!data.readlist || data.readlist.length === 0) {
                        document.getElementById("emptyMessage").classList.remove("hidden");
                        return;
                    }

                    data.readlist.forEach(item => {
                        const card = document.createElement("div");
                        card.className = "bg-gray-50 p-4 rounded-lg shadow-md card hover:shadow-xl";
                        card.innerHTML = `
                            <img src="http://localhost/new%20proj/open%20library/${item.image_path}" 
                                alt="${item.title}" 
                                class="w-full h-48 object-cover rounded-md mb-4">
                            <h3 class="text-lg font-semibold text-gray-800">${item.title}</h3>
                            <p><strong>Author:</strong> ${item.author}</p>
                            <p><strong>Status:</strong> ${item.status}</p>
                            <p class="text-sm text-gray-600">${item.notes || "No notes available."}</p>
                            <a href="http://localhost/new%20proj/open%20library/${item.pdf_path}" target="_blank"
                                class="inline-block mt-4 text-blue-600 hover:underline">Read PDF</a>
                            <button onclick="removeFromReadlist(${item.readlist_id})"
                                    class="block mt-2 text-red-600 hover:underline text-sm">Remove</button>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error("Failed to load readlist", err);
                });
        }

        function removeFromReadlist(readlist_id) {
            if (!confirm("Are you sure you want to remove this book?")) return;

            fetch("http://localhost/new%20proj/open%20library/backend/api/readlist.php", {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ readlist_id })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        fetchReadlist();
                    } else {
                        alert("Failed to delete: " + (data.error || "Unknown error."));
                    }
                })
                .catch(err => {
                    console.error("Error deleting item", err);
                });
        }

        // Load the readlist on page load
        document.addEventListener("DOMContentLoaded", fetchReadlist);
    </script>
</body>

</html>
