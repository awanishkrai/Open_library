<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Open Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">
    <div class="bg-white p-6 rounded shadow-md w-96">
        <h2 class="text-2xl font-bold text-center mb-4">Login</h2>

        <label for="username" class="block mb-1 font-medium">Username</label>
        <input id="username" type="text" placeholder="Enter Username"
            class="w-full p-2 border rounded mb-2 focus:ring-2 focus:ring-blue-500 outline-none">

        <label for="password" class="block mb-1 font-medium">Password</label>
        <input id="password" type="password" placeholder="Enter Password"
            class="w-full p-2 border rounded mb-4 focus:ring-2 focus:ring-blue-500 outline-none">

        <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition">
            Login
        </button>

        <p id="error-message" class="text-red-500 text-sm text-center mt-2 hidden">Invalid credentials, try again.</p>

        <p class="mt-2 text-center">Don't have an account?
            <a href="register.html" class="text-blue-500 hover:underline">Register</a>
        </p>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Press Enter to Login
            document.getElementById("password").addEventListener("keypress", function (event) {
                if (event.key === "Enter") {
                    login();
                }
            });
        });

        function login() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMessage = document.getElementById("error-message");

            if (!username || !password) {
                errorMessage.innerText = "Please fill in all fields.";
                errorMessage.classList.remove("hidden");
                return;
            }

            fetch("http://localhost/new%20proj/open%20library/backend/auth/auth.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        localStorage.setItem("user", JSON.stringify(data.user));
                        window.location.href = "index.html";
                    } else {
                        errorMessage.innerText = "Invalid credentials, try again.";
                        errorMessage.classList.remove("hidden");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    errorMessage.innerText = "An error occurred. Try again later.";
                    errorMessage.classList.remove("hidden");
                });
        }
    </script>
</body>

</html>
